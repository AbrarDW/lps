name: Installers

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  # One-click releases: Actions → Installers → Run workflow, on master,
  # with a version number. Leave the version empty to only build.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release v<this version> from master, e.g. 0.2.0 (empty = build only)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # create GitHub Releases and attach the installers

jobs:
  # Checks a one-click release request and hands the version to the builds.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Inputs reach scripts only through env, never ${{ }} inside run:, so a
      # crafted version string cannot inject commands.
      - name: Check the release request
        id: check
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          v=$(printf '%s' "$RELEASE" | tr -d '[:space:]'); v=${v#v}
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$RELEASE' is not like 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::Releases are made from master; this run is on $GITHUB_REF. Choose master in 'Use workflow from'."; exit 1
          fi
          git fetch --tags --quiet origin
          if [ -n "$(git tag --list "v$v")" ]; then echo "::error::Tag v$v already exists. Pick a new version."; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Releasing v$v from $GITHUB_SHA"

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      LPS_VERSION: ${{ needs.prepare.outputs.version }} # empty: git describe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Go tests on Windows (Windows-only code paths)
        shell: pwsh
        run: go test ./internal/platform/... ./internal/tunnel/... ./internal/app/...

      # Code signing (optional): add the repository secrets WINDOWS_SIGN_PFX_BASE64
      # (a .pfx code-signing certificate, base64-encoded) and WINDOWS_SIGN_PASSWORD.
      # Without them the installer is built unsigned.
      - name: Load the code-signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host "No signing certificate configured: building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'lps-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "LPS_SIGN_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LPS_SIGN_PASSWORD=$env:PFX_PASSWORD" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Signing certificate loaded."

      - name: Build installer
        shell: pwsh
        run: .\build.ps1 installer

      - name: Check the signing path (throwaway self-signed certificate, scratch copy only)
        if: env.LPS_SIGN_PFX == ''
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=LPS signing self-test' -CertStoreLocation Cert:\CurrentUser\My
          $pfx = Join-Path $env:RUNNER_TEMP 'selftest.pfx'
          $pw = ConvertTo-SecureString -String 'selftest' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          $copy = Join-Path $env:RUNNER_TEMP 'lpsd-signing-test.exe'
          Copy-Item .\bin\lpsd.exe $copy
          $env:LPS_SIGN_PFX = $pfx; $env:LPS_SIGN_PASSWORD = 'selftest'; $env:LPS_SIGN_TIMESTAMP = 'none'
          .\build.ps1 sign -Files $copy
          $sig = Get-AuthenticodeSignature $copy
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Subject -ne 'CN=LPS signing self-test') { throw "copy was not signed: $($sig.Status) $($sig.StatusMessage)" }
          Write-Host "Signing path works (signer: $($sig.SignerCertificate.Subject); status $($sig.Status), expected for a self-signed cert)."
          if ((Get-AuthenticodeSignature .\bin\lpsd.exe).SignerCertificate) { throw "the shipped lpsd.exe must not carry the self-test signature" }
          Remove-Item Cert:\CurrentUser\My\$($cert.Thumbprint)

      - name: Check the checksum file
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\LPS-Setup-*.exe | Select-Object -First 1
          $want = (Get-Content "$($setup.FullName).sha256").Split(' ')[0]
          $got = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $want vs $got" }
          Write-Host "$($setup.Name) SHA-256 $got"
          Write-Host "Signature: $((Get-AuthenticodeSignature $setup.FullName).Status)"

      - name: Smoke test lpsd.exe
        shell: pwsh
        run: |
          .\bin\lpsd.exe version
          $data = Join-Path $env:RUNNER_TEMP 'lps-smoke'
          $p = Start-Process .\bin\lpsd.exe -ArgumentList 'serve','-data',$data,'-no-remote' -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:7070/api/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw "lpsd did not become healthy" }
          Write-Host "Setup checks on this runner:"
          (Invoke-WebRequest http://127.0.0.1:7070/api/setup/checks -UseBasicParsing).Content
          Stop-Process -Id $p.Id -Force

      - name: Silent install, check, uninstall
        shell: pwsh
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem dist\LPS-Setup-*.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=autostart' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\LPS'
          foreach ($f in 'lps.exe','lpsd.exe','unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f after install" }
          }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name LPS -ErrorAction SilentlyContinue
          if (-not $run) { throw "autostart Run value not created" }
          Write-Host "Autostart: $($run.LPS)"
          & (Join-Path $dir 'lpsd.exe') version

          # In-app update: the dashboard runs the new installer silently over
          # the existing install with /RELAUNCH=1; LPS must come back by itself.
          Write-Host "Update over the existing install with /RELAUNCH=1"
          # Wait for the installer only: Start-Process -Wait would also wait for
          # the lps.exe it starts, which keeps running by design.
          $u = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/RELAUNCH=1' -PassThru
          if (-not $u.WaitForExit(300000)) { throw "the update installer did not finish within 5 minutes" }
          if ($u.ExitCode -ne 0) { throw "the update installer exited with code $($u.ExitCode)" }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:7070/api/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          $proc = Get-Process lps -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$dir*" }
          if (-not $ok -or -not $proc) { Get-Content "$env:ProgramData\LPS\lps.log" -ErrorAction SilentlyContinue; throw "LPS did not restart after the silent update" }
          Write-Host "LPS restarted after the update (pid $($proc.Id))"
          $proc | Stop-Process -Force
          Start-Sleep -Seconds 2

          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'lps.exe')) { throw "lps.exe still present after uninstall" }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name LPS -ErrorAction SilentlyContinue) { throw "Run value not removed" }
          Write-Host "Install/uninstall OK"

      - name: Launch desktop app (best effort; CI has no interactive desktop)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process .\bin\lps.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:7070/api/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:ProgramData\LPS\lps.log" -ErrorAction SilentlyContinue; throw "lps.exe did not serve the dashboard" }
          Write-Host "lps.exe started and served the dashboard"

      - uses: actions/upload-artifact@v4
        with:
          name: LPS-windows
          path: |
            dist/LPS-Setup-*.exe
            dist/LPS-Setup-*.exe.sha256
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build lpsd for amd64 and arm64
        env:
          LPS_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -n "$LPS_VERSION" ]; then v=v$LPS_VERSION; else v=$(git describe --tags --always --dirty 2>/dev/null || echo dev); fi
          echo "LPS_BUILD_VERSION=$v" >> "$GITHUB_ENV"
          (cd web && npm ci && npm run build)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -ldflags "-s -w -X main.version=$v" -o bin/lpsd-linux-$arch ./cmd/lpsd
          done

      - name: Build .deb packages
        run: |
          for arch in amd64 arm64; do
            installer/linux/build-deb.sh bin/lpsd-linux-$arch $arch "$LPS_BUILD_VERSION" dist
          done
          for f in dist/*.deb; do echo "$f: $(dpkg-deb --field "$f" Version Architecture | tr '\n' ' ')"; done
          (cd dist && sha256sum -c ./*.sha256)

      # Install the amd64 package the way a user would (sudo, so SUDO_USER is
      # this runner's user): LPS must come up as that user's systemd service,
      # survive an upgrade and be stopped again by removal.
      - name: Install, upgrade and remove the package
        timeout-minutes: 10
        run: |
          set -x
          deb=$(ls dist/lps_*_amd64.deb)
          uid=$(id -u)
          sudo loginctl enable-linger "$USER" # start this user's systemd manager
          for i in $(seq 30); do [ -S /run/user/$uid/bus ] && break; sleep 1; done
          export XDG_RUNTIME_DIR=/run/user/$uid
          health() {
            for i in $(seq 30); do curl -fsS http://127.0.0.1:7070/api/health >/dev/null 2>&1 && return 0; sleep 1; done
            journalctl --user -u lps --no-pager | tail -50; return 1
          }

          sudo dpkg -i "$deb"
          test -x /usr/bin/lpsd
          systemctl --user is-enabled lps.service
          health
          pid=$(systemctl --user show -p MainPID --value lps.service)
          echo "running as pid $pid"
          curl -fsS http://127.0.0.1:7070/api/setup/checks; echo

          # Reinstall = upgrade: the service must restart on the new binary.
          sudo dpkg -i "$deb"
          health
          new=$(systemctl --user show -p MainPID --value lps.service)
          [ "$new" != "$pid" ] || { echo "::error::LPS was not restarted by the upgrade"; exit 1; }

          sudo dpkg -r lps
          if test -e /usr/bin/lpsd; then echo "::error::lpsd still installed after removal"; exit 1; fi
          if systemctl --user is-active --quiet lps.service; then echo "::error::LPS still running after removal"; exit 1; fi
          if curl -fsS http://127.0.0.1:7070/api/health >/dev/null 2>&1; then echo "::error::dashboard still answering after removal"; exit 1; fi
          echo "Install/upgrade/remove OK"

      - uses: actions/upload-artifact@v4
        with:
          name: LPS-linux
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests on macOS (macOS-only code paths)
        run: go test ./internal/platform/... ./internal/docker/... ./internal/tunnel/...

      - name: Build a universal lpsd and the .pkg
        env:
          LPS_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -n "$LPS_VERSION" ]; then v=v$LPS_VERSION; else v=$(git describe --tags --always --dirty 2>/dev/null || echo dev); fi
          (cd web && npm ci && npm run build)
          make pkg VERSION="$v"
          lipo -archs bin/lpsd-darwin-universal
          (cd dist && shasum -a 256 -c ./*.pkg.sha256)
          pkgutil --payload-files dist/*.pkg

      # Install the package the way a user would: LPS must come up as the
      # signed-in user's launch agent, restart on the new binary when the
      # package is installed again, and be gone after lps-uninstall.
      - name: Install, upgrade and uninstall the package
        timeout-minutes: 10
        run: |
          set -x
          pkg=$(ls dist/*.pkg)
          uid=$(id -u)
          echo "console user: $(stat -f%Su /dev/console), me: $(id -un)"
          health() {
            for i in $(seq 30); do curl -fsS http://127.0.0.1:7070/api/health >/dev/null 2>&1 && return 0; sleep 1; done
            tail -50 ~/Library/Logs/LPS/lpsd.log; launchctl print gui/$uid/com.abrardw.lps; return 1
          }
          pid() { launchctl print gui/$uid/com.abrardw.lps | awk '$1 == "pid" {print $3}'; }

          sudo installer -pkg "$pkg" -target /
          test -x /usr/local/bin/lpsd
          lpsd version
          test -f ~/Library/LaunchAgents/com.abrardw.lps.plist
          plutil -lint ~/Library/LaunchAgents/com.abrardw.lps.plist
          health
          old=$(pid); echo "running as pid $old"
          lpsd autostart

          # Installing again = upgrade: LPS must restart on the new binary.
          sudo installer -pkg "$pkg" -target /
          health
          new=$(pid)
          [ -n "$new" ] && [ "$new" != "$old" ] || { echo "::error::LPS was not restarted by the upgrade ($old -> $new)"; exit 1; }

          sudo lps-uninstall
          if test -e /usr/local/bin/lpsd; then echo "::error::lpsd still installed"; exit 1; fi
          if test -e ~/Library/LaunchAgents/com.abrardw.lps.plist; then echo "::error::launch agent left behind"; exit 1; fi
          if launchctl print gui/$uid/com.abrardw.lps >/dev/null 2>&1; then echo "::error::agent still loaded"; exit 1; fi
          if curl -fsS http://127.0.0.1:7070/api/health >/dev/null 2>&1; then echo "::error::dashboard still answering after uninstall"; exit 1; fi
          if pkgutil --pkg-info com.abrardw.lps >/dev/null 2>&1; then echo "::error::package receipt left behind"; exit 1; fi
          echo "Install/upgrade/uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: LPS-macos
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
          if-no-files-found: error

  # A pushed v* tag (or a release published in the GitHub UI) gets the
  # installers attached to its release; a one-click release creates the tag
  # on the tested commit and the release.
  release:
    needs: [prepare, windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Publish release
        if: needs.prepare.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LPS ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            **Windows:** download `LPS-Setup-${{ needs.prepare.outputs.version }}.exe` below and run it (no administrator rights needed). Until the installer is code-signed, Chrome or Windows may warn about it; see [Download blocked?](https://github.com/${{ github.repository }}#download-blocked) in the README. Needs Windows 10/11 with WSL2 and Docker Desktop; the setup wizard walks you through both.

            **Linux (Debian, Ubuntu):** download the `.deb` for your machine (`amd64` for most PCs, `arm64` for a Raspberry Pi or other ARM board) and install it with `sudo apt install ./lps_*.deb`. Needs Docker; see [Install on Linux](https://github.com/${{ github.repository }}#install-on-linux).

            **macOS (11 or later, Apple Silicon or Intel):** download `LPS-${{ needs.prepare.outputs.version }}-macOS.pkg` and open it. It isn't signed by Apple yet, so macOS may refuse to open it at first; see [Install on macOS](https://github.com/${{ github.repository }}#install-on-macos). Needs Docker Desktop, OrbStack or Colima.

            Check any file against the `.sha256` published next to it.
          files: dist/*
