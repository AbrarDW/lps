name: Windows installer

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  # One-click releases: Actions → Windows installer → Run workflow, on master,
  # with a version number. Leave the version empty to only build.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release v<this version> from master, e.g. 0.2.0 (empty = build only)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # create GitHub Releases and attach the installer

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Inputs reach scripts only through env, never ${{ }} inside run:, so a
      # crafted version string cannot inject commands.
      - name: Check the release request
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          $v = $env:RELEASE.Trim() -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Version '$($env:RELEASE)' is not like 1.2.3 or 1.2.3-beta.1" }
          if ($env:GITHUB_REF -ne 'refs/heads/master') { throw "Releases are made from master; this run is on $($env:GITHUB_REF). Choose master in 'Use workflow from'." }
          git fetch --tags --quiet origin
          if (git tag --list "v$v") { throw "Tag v$v already exists. Pick a new version." }
          "LPS_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LPS_RELEASE_TAG=v$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Releasing v$v from $($env:GITHUB_SHA)"

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Go tests on Windows (Windows-only code paths)
        shell: pwsh
        run: go test ./internal/platform/... ./internal/tunnel/... ./internal/app/...

      # Code signing (optional): add the repository secrets WINDOWS_SIGN_PFX_BASE64
      # (a .pfx code-signing certificate, base64-encoded) and WINDOWS_SIGN_PASSWORD.
      # Without them the installer is built unsigned.
      - name: Load the code-signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host "No signing certificate configured: building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'lps-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "LPS_SIGN_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LPS_SIGN_PASSWORD=$env:PFX_PASSWORD" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Signing certificate loaded."

      - name: Build installer
        shell: pwsh
        run: .\build.ps1 installer

      - name: Check the signing path (throwaway self-signed certificate, scratch copy only)
        if: env.LPS_SIGN_PFX == ''
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=LPS signing self-test' -CertStoreLocation Cert:\CurrentUser\My
          $pfx = Join-Path $env:RUNNER_TEMP 'selftest.pfx'
          $pw = ConvertTo-SecureString -String 'selftest' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          $copy = Join-Path $env:RUNNER_TEMP 'lpsd-signing-test.exe'
          Copy-Item .\bin\lpsd.exe $copy
          $env:LPS_SIGN_PFX = $pfx; $env:LPS_SIGN_PASSWORD = 'selftest'; $env:LPS_SIGN_TIMESTAMP = 'none'
          .\build.ps1 sign -Files $copy
          $sig = Get-AuthenticodeSignature $copy
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Subject -ne 'CN=LPS signing self-test') { throw "copy was not signed: $($sig.Status) $($sig.StatusMessage)" }
          Write-Host "Signing path works (signer: $($sig.SignerCertificate.Subject); status $($sig.Status), expected for a self-signed cert)."
          if ((Get-AuthenticodeSignature .\bin\lpsd.exe).SignerCertificate) { throw "the shipped lpsd.exe must not carry the self-test signature" }
          Remove-Item Cert:\CurrentUser\My\$($cert.Thumbprint)

      - name: Check the checksum file
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\LPS-Setup-*.exe | Select-Object -First 1
          $want = (Get-Content "$($setup.FullName).sha256").Split(' ')[0]
          $got = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $want vs $got" }
          Write-Host "$($setup.Name) SHA-256 $got"
          Write-Host "Signature: $((Get-AuthenticodeSignature $setup.FullName).Status)"

      - name: Smoke test lpsd.exe
        shell: pwsh
        run: |
          .\bin\lpsd.exe version
          $data = Join-Path $env:RUNNER_TEMP 'lps-smoke'
          $p = Start-Process .\bin\lpsd.exe -ArgumentList 'serve','-data',$data,'-no-remote' -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:7070/api/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw "lpsd did not become healthy" }
          Write-Host "Setup checks on this runner:"
          (Invoke-WebRequest http://127.0.0.1:7070/api/setup/checks -UseBasicParsing).Content
          Stop-Process -Id $p.Id -Force

      - name: Silent install, check, uninstall
        shell: pwsh
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem dist\LPS-Setup-*.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=autostart' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\LPS'
          foreach ($f in 'lps.exe','lpsd.exe','unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f after install" }
          }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name LPS -ErrorAction SilentlyContinue
          if (-not $run) { throw "autostart Run value not created" }
          Write-Host "Autostart: $($run.LPS)"
          & (Join-Path $dir 'lpsd.exe') version

          # In-app update: the dashboard runs the new installer silently over
          # the existing install with /RELAUNCH=1; LPS must come back by itself.
          Write-Host "Update over the existing install with /RELAUNCH=1"
          # Wait for the installer only: Start-Process -Wait would also wait for
          # the lps.exe it starts, which keeps running by design.
          $u = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/RELAUNCH=1' -PassThru
          if (-not $u.WaitForExit(300000)) { throw "the update installer did not finish within 5 minutes" }
          if ($u.ExitCode -ne 0) { throw "the update installer exited with code $($u.ExitCode)" }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:7070/api/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          $proc = Get-Process lps -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$dir*" }
          if (-not $ok -or -not $proc) { Get-Content "$env:ProgramData\LPS\lps.log" -ErrorAction SilentlyContinue; throw "LPS did not restart after the silent update" }
          Write-Host "LPS restarted after the update (pid $($proc.Id))"
          $proc | Stop-Process -Force
          Start-Sleep -Seconds 2

          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'lps.exe')) { throw "lps.exe still present after uninstall" }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name LPS -ErrorAction SilentlyContinue) { throw "Run value not removed" }
          Write-Host "Install/uninstall OK"

      - name: Launch desktop app (best effort; CI has no interactive desktop)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process .\bin\lps.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:7070/api/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:ProgramData\LPS\lps.log" -ErrorAction SilentlyContinue; throw "lps.exe did not serve the dashboard" }
          Write-Host "lps.exe started and served the dashboard"

      - uses: actions/upload-artifact@v4
        with:
          name: LPS-Setup
          path: |
            dist/LPS-Setup-*.exe
            dist/LPS-Setup-*.exe.sha256
          if-no-files-found: error

      # A pushed v* tag (or a release published in the GitHub UI) gets the
      # installer attached to its release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LPS-Setup-*.exe
            dist/LPS-Setup-*.exe.sha256

      # One-click release: creates the tag on the tested commit and the release.
      - name: Publish release
        if: env.LPS_RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LPS_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: LPS ${{ env.LPS_RELEASE_TAG }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            **Install:** download `LPS-Setup-${{ env.LPS_VERSION }}.exe` below and run it (no administrator rights needed). Until the installer is code-signed, Chrome or Windows may warn about it; see [Download blocked?](https://github.com/${{ github.repository }}#download-blocked) in the README. Check the file against `LPS-Setup-${{ env.LPS_VERSION }}.exe.sha256`.

            **Needs:** Windows 10/11 with WSL2 and Docker Desktop; the setup wizard walks you through both.
          files: |
            dist/LPS-Setup-*.exe
            dist/LPS-Setup-*.exe.sha256
